<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem lại bài làm - ĐGNL Khai Tâm</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Be+Vietnam+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                macros: {
                    vc: '\\infty',
                    heva: ['\\left\\{\\begin{array}{ll}#1\\end{array}\\right.', 1],
                    hoac: ['\\left[\\begin{array}{ll}#1\\end{array}\\right.', 1]
                }
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <link rel="stylesheet" href="https://tikzjax.com/v1/tikzjax.css">
    <script src="https://tikzjax.com/v1/tikzjax.js"></script>

    <!-- Firebase (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <style>
        :root { color-scheme: light; --bs-primary: var(--troi); --bs-primary-rgb: 29, 155, 214; }
        body { background: #f8fafc; font-family: var(--font-ui); color: #1e293b; min-height: 100vh; margin: 0; }

        #login-overlay {
            position: fixed; inset: 0; z-index: 2000;
            
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card { background: #ffffff; border-radius: 20px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        .login-card .logo-title { font-size: 1.25rem; font-weight: 800; color: var(--troi-dam); margin-bottom: 6px; }
        .login-card .logo-sub { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .btn-login-submit { display: flex; align-items: center; justify-content: center; gap: 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 18px; width: 100%; font-weight: 700; color: #1e293b; cursor: pointer; }
        .btn-login-submit img { width: 20px; height: 20px; }
        .login-error { display: none; margin-top: 16px; padding: 12px; border-radius: 10px; background: #fee2e2; color: #b91c1c; font-size: 0.85rem; font-weight: 600; }
        .login-loading { display: none; margin-top: 16px; color: #64748b; font-size: 0.85rem; }

        .app-header { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 20px; position: sticky; top: 0; z-index: 1030; }
        .main-title { font-size: 1.05rem; font-weight: 800; color: var(--troi-dam); margin: 0; }

        .main-layout { max-width: 900px; margin: 0 auto; padding: 20px; }
        .meta-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px 22px; margin-bottom: 20px; }
        .meta-box .m-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; padding: 4px 0; font-size: 0.92rem; }
        .meta-box .m-row b { color: #0f172a; }
        .meta-score { font-weight: 800; font-size: 1.3rem; }
        .meta-score.good { color: var(--troi-dam); } .meta-score.bad { color: #b91c1c; }
        .exam-panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; }

        .group-block { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 25px; }
        .group-block:last-child { border: none; }
        .group-block-cum { border: 2px solid var(--troi-vien); background: #ffffff; border-radius: 14px; padding: 16px 18px 6px; margin-bottom: 25px; }
        .group-block-cum .question-item:last-child { border-bottom: none; margin-bottom: 6px; padding-bottom: 6px; }
        .group-block-cum:last-child { border: 2px solid var(--troi-vien); }
        .shared-context { background: #ffffff; border: 1px solid var(--troi-vien); border-left: 5px solid var(--troi); border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 14px; font-size: 0.92rem; color: var(--muc); font-weight: 600; }
        .shared-context-label { display: block; color: var(--troi-dam); font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; }
        .question-item { border-bottom: 1px solid #f1f5f9; padding-bottom: 20px; margin-bottom: 20px; }
        .question-item:last-child { border: none; }
        .question-text { font-size: 0.95rem; font-weight: 600; color: #0f172a; line-height: 1.6; }

        .custom-option-wrapper { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; margin-top: 8px; display: flex; align-items: center; }
        .form-check-input { width: 1.1rem; height: 1.1rem; flex-shrink: 0; border: 2px solid #64748b; }
        .form-check-label { color: #334155; margin-left: 8px; font-size: 0.9rem; width: 100%; }
        .custom-option-wrapper.option-correct { background: #dcfce7; border-color: #22c55e; }
        .custom-option-wrapper.option-correct .form-check-label { color: var(--troi-dam); font-weight: 700; }
        .custom-option-wrapper.option-wrong { background: #fee2e2; border-color: #ef4444; }
        .custom-option-wrapper.option-wrong .form-check-label { color: #b91c1c; font-weight: 700; }

        .explain-box { display: block; background-color: var(--troi-nhat); padding: 12px; margin-top: 10px; border-radius: 8px; font-size: 0.85rem; color: var(--muc); border: 1px solid var(--troi-vien); max-width: 100%; overflow-x: hidden; word-wrap: break-word; overflow-wrap: break-word; }
        .explain-box img, .question-text img { max-width: 100%; height: auto; display: block; margin: 8px auto; }
        .nguon-cau { margin-top: 10px; font-size: 0.78rem; font-style: italic; color: #4b7c63; border-top: 1px dashed var(--troi-vien); padding-top: 6px; }
        mjx-container[display="true"] { max-width: 100%; overflow-x: auto; overflow-y: hidden; display: block !important; }
        .question-text, .explain-box, .form-check-label, .shared-context { word-wrap: break-word; overflow-wrap: break-word; }

        #err-box, #loading-box { max-width: 900px; margin: 60px auto; text-align: center; color: #64748b; padding: 0 20px; }
    </style>
    <link rel="stylesheet" href="css/giao-dien.css?v=20261024f">
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div class="logo-title" id="brand-title-login">Xem lại bài làm</div>
            <div class="logo-sub">Đăng nhập bằng Gmail đã đăng ký với giáo viên để xem lại bài làm</div>
            <button type="button" class="btn-login-submit" id="btn-dang-nhap">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
                Đăng nhập bằng Google
            </button>
            <div class="login-loading" id="login-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý đăng nhập...</div>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="app-root" style="display:none;">
        <header class="app-header">
            <h1 class="main-title"><i class="fa-solid fa-eye"></i> Xem lại bài làm</h1>
        </header>
        <div class="main-layout">
            <div id="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải bài làm...</div>
            <div id="err-box" style="display:none;"></div>
            <div id="content-box" style="display:none;">
                <div class="meta-box" id="meta-box"></div>
                <div class="exam-panel" id="questions-container"></div>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js?v=20261024i"></script>
    <script src="js/xem-lai.js?v=20261024i"></script>
</body>
</html>
