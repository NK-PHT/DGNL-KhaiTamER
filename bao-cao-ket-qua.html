<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo kết quả học sinh - ĐGNL Khai Tâm</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Be+Vietnam+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { color-scheme: light; --bs-primary: var(--troi); --bs-primary-rgb: 29, 155, 214; }
        body { background: #f8fafc; font-family: var(--font-ui); color: #1e293b; min-height: 100vh; margin: 0; }

        #login-overlay {
            position: fixed; inset: 0; z-index: 2000;
            
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card { background: #ffffff; border-radius: 20px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        .login-card .logo-title { font-size: 1.25rem; font-weight: 800; color: var(--troi-dam); margin-bottom: 6px; }
        .login-card .logo-sub { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .btn-login-submit { display: flex; align-items: center; justify-content: center; gap: 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 18px; width: 100%; font-weight: 700; color: #1e293b; cursor: pointer; }
        .btn-login-submit img { width: 20px; height: 20px; }
        .login-error { display: none; margin-top: 16px; padding: 12px; border-radius: 10px; background: #fee2e2; color: #b91c1c; font-size: 0.85rem; font-weight: 600; }
        .login-loading { display: none; margin-top: 16px; color: #64748b; font-size: 0.85rem; }

        .app-header { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 20px; position: sticky; top: 0; z-index: 1030; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .main-title { font-size: 1.05rem; font-weight: 800; color: var(--troi-dam); margin: 0; }

        .main-layout { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .btn-export { background: var(--troi); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; }
        .btn-export:disabled { opacity: 0.6; }
        .table-wrap { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; text-align: left; white-space: nowrap; }
        th { background: #f1f5f9; color: #334155; position: sticky; top: 0; }
        tr:hover td { background: #f8fafc; }
        .score-good { color: var(--troi-dam); font-weight: 700; }
        .score-bad { color: #b91c1c; font-weight: 700; }
        #loading-box, #err-box { text-align: center; color: #64748b; padding: 60px 20px; }
    </style>
    <link rel="stylesheet" href="css/giao-dien.css?v=20261024e">
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div class="logo-title">Báo cáo kết quả học sinh</div>
            <div class="logo-sub">Trang riêng cho giáo viên quản trị — đăng nhập bằng Gmail quản trị</div>
            <button type="button" class="btn-login-submit" id="btn-dang-nhap">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
                Đăng nhập bằng Google
            </button>
            <div class="login-loading" id="login-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý đăng nhập...</div>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="app-root" style="display:none;">
        <header class="app-header">
            <h1 class="main-title"><i class="fa-solid fa-chart-column"></i> Báo cáo kết quả học sinh</h1>
            <div class="d-flex gap-2">
            <a class="btn btn-outline-success btn-sm" href="quan-ly-btvn.html"><i class="fa-solid fa-calendar-week"></i> Bài tập tuần</a>
                <a class="btn btn-outline-success btn-sm" href="quan-ly-hoc-sinh.html"><i class="fa-solid fa-user-check"></i> Danh sách Gmail học sinh</a>
            <button class="btn btn-outline-secondary btn-sm" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            </div>
        </header>
        <div class="main-layout">
            <div id="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
            <div id="err-box" style="display:none;"></div>
            <div id="content-box" style="display:none;">
                <div class="toolbar">
                    <div class="text-muted small" id="tong-so"></div>
                    <button class="btn-export" id="btn-xuat-excel"><i class="fa-solid fa-file-excel"></i> Xuất ra Excel</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Thời gian nộp</th>
                                <th>Họ và tên</th>
                                <th>Email</th>
                                <th>Đề đã làm</th>
                                <th>Đúng/Tổng</th>
                                <th>Điểm</th>
                                <th>Thời gian làm bài</th>
                                <th>Xem lại</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js?v=20261021b"></script>
    <script src="js/bao-cao-ket-qua.js?v=20261021b"></script>
</body>
</html>
