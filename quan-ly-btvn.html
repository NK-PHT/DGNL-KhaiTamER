<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bài tập tuần - ĐGNL Khai Tâm</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Be+Vietnam+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { color-scheme: light; --g: var(--troi); --gd: var(--troi-dam); }
        body { background: #f8fafc; font-family: var(--font-ui); color: #1e293b; margin: 0; min-height: 100vh; }
        #login-overlay { position: fixed; inset: 0; z-index: 2000;  display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #fff; border-radius: 20px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
        .login-card .logo-title { font-size: 1.25rem; font-weight: 800; color: var(--gd); margin-bottom: 6px; }
        .login-card .logo-sub { color: #64748b; font-size: .9rem; margin-bottom: 24px; }
        .btn-login-submit { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 18px; width: 100%; font-weight: 700; color: #1e293b; }
        .btn-login-submit img { width: 20px; height: 20px; }
        .login-error { display: none; margin-top: 16px; padding: 12px; border-radius: 10px; background: #fee2e2; color: #b91c1c; font-size: .85rem; font-weight: 600; }
        .login-loading { display: none; margin-top: 16px; color: #64748b; font-size: .85rem; }
        .app-header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 16px; position: sticky; top: 0; z-index: 1030; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .main-title { font-size: 1.05rem; font-weight: 800; color: var(--gd); margin: 0; }
        .wrap { max-width: 1150px; margin: 0 auto; padding: 16px; }
        .card-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .card-box h2 { font-size: 1rem; font-weight: 800; color: var(--gd); margin-bottom: 10px; }
        textarea { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
        .table-wrap { overflow: auto; max-height: 70vh; }
        table { width: 100%; border-collapse: collapse; font-size: .86rem; }
        th, td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; text-align: left; white-space: nowrap; }
        th { background: #f1f5f9; color: #334155; position: sticky; top: 0; z-index: 1; }
        .badge-st { font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
        .st-ok { background: #dcfce7; color: #166534; } .st-late { background: #fef3c7; color: #92400e; } .st-none { background: #f1f5f9; color: #475569; } .st-miss { background: #fee2e2; color: #b91c1c; }
        .msg { padding: 10px 12px; border-radius: 10px; font-size: .86rem; margin-top: 10px; white-space: pre-line; }
        .msg-ok { background: #dcfce7; color: #166534; } .msg-warn { background: #fef3c7; color: #92400e; } .msg-err { background: #fee2e2; color: #b91c1c; }
        .tuan-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 8px; }
        .tuan-row.active { border-color: var(--g); background: var(--troi-nhat); }
        .bar { height: 8px; background: #fee2e2; border-radius: 4px; overflow: hidden; min-width: 80px; }
        .bar > div { height: 100%; background: var(--troi); }
        .tk-thap td { background: #fff7ed; }
        .nav-tabs .nav-link { font-weight: 700; color: #475569; } .nav-tabs .nav-link.active { color: var(--gd); }
    </style>
    <link rel="stylesheet" href="css/giao-dien.css?v=20261024f">
</head>
<body>
    <div id="login-overlay">
        <div class="login-card">
            <div class="logo-title">Quản lý bài tập tuần</div>
            <div class="logo-sub">Trang riêng cho giáo viên quản trị</div>
            <button type="button" class="btn-login-submit" id="btn-dang-nhap"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Đăng nhập bằng Google</button>
            <div class="login-loading" id="login-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý đăng nhập...</div>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="app-root" style="display:none;">
        <header class="app-header">
            <h1 class="main-title"><i class="fa-solid fa-calendar-week"></i> Quản lý bài tập tuần</h1>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-outline-success btn-sm" href="quan-ly-hoc-sinh.html"><i class="fa-solid fa-user-check"></i> Danh sách Gmail</a>
                <a class="btn btn-outline-success btn-sm" href="bao-cao-ket-qua.html"><i class="fa-solid fa-chart-column"></i> Báo cáo luyện đề</a>
                <button class="btn btn-outline-secondary btn-sm" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            </div>
        </header>
        <div class="wrap">
            <div class="card-box">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h2 class="mb-0" id="form-tieu-de"><i class="fa-solid fa-plus"></i> Giao bài tập tuần mới</h2>
                    <button class="btn btn-link btn-sm" id="btn-huy-sua" style="display:none;">Huỷ sửa — tạo tuần mới</button>
                </div>
                <div class="row g-2 mt-1">
                    <div class="col-md-5"><label class="form-label small fw-bold mb-1">Tên bài</label><input class="form-control" id="f-ten" placeholder="VD: BTVN Tuần 1 — Đề thi thử số 15"></div>
                    <div class="col-6 col-md-2"><label class="form-label small fw-bold mb-1">Số câu</label><input type="number" class="form-control" id="f-so-cau" value="120" min="1" max="200"></div>
                    <div class="col-6 col-md-5"><label class="form-label small fw-bold mb-1">Hạn nộp</label><input type="datetime-local" class="form-control" id="f-han"></div>
                    <div class="col-12"><label class="form-label small fw-bold mb-1">Link đề (không bắt buộc)</label><input class="form-control" id="f-link" placeholder="Link Google Drive file PDF đề để học sinh mở trên web — bỏ trống nếu chỉ phát giấy"></div>
                    <div class="col-12">
                        <label class="form-label small fw-bold mb-1">Đáp án đúng</label>
                        <textarea class="form-control" id="f-dap-an" rows="4" placeholder="Dán chuỗi liền: ABDCBA...&#10;hoặc dạng có số câu: 1A 2B 3.C 4-D ... (cách nhau tuỳ ý, xuống dòng cũng được)&#10;Có thể để trống và nhập sau — học sinh vẫn nộp được."></textarea>
                        <div class="small text-muted mt-1" id="f-dap-an-dem"></div>
                    </div>
                </div>
                <button class="btn btn-success mt-3 fw-bold" id="btn-luu"><i class="fa-solid fa-floppy-disk"></i> Lưu bài tập tuần</button>
                <div id="f-msg"></div>
            </div>

            <div class="card-box">
                <h2><i class="fa-solid fa-list"></i> Các tuần đã giao</h2>
                <div id="ds-tuan"><div class="text-muted small"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div></div>
            </div>

            <div class="card-box" id="khung-kq" style="display:none;">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                    <h2 class="mb-0" id="kq-ten"></h2>
                    <button class="btn btn-success btn-sm" id="btn-excel"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
                </div>
                <div class="small text-muted mb-2" id="kq-tom-tat"></div>
                <ul class="nav nav-tabs mb-2">
                    <li class="nav-item"><button class="nav-link active" data-tab="hs">Học sinh</button></li>
                    <li class="nav-item"><button class="nav-link" data-tab="cau">Thống kê từng câu (để sửa bài)</button></li>
                </ul>
                <div id="tab-hs" class="table-wrap"></div>
                <div id="tab-cau" style="display:none;">
                    <div class="d-flex gap-2 align-items-center small mb-2 flex-wrap">
                        <label><input type="checkbox" id="tk-sap-xep" checked> Xếp câu sai nhiều lên đầu</label>
                        <span class="text-muted">· tô cam: dưới 50% làm đúng</span>
                    </div>
                    <div class="table-wrap" id="tk-bang"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/firebase-config.js?v=20261024c"></script>
    <script src="js/quan-ly-btvn.js?v=20261024c"></script>
</body>
</html>
